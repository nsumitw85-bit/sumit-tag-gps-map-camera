name: Build Sumit Tag Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android project files
        run: |
          test -f android-project/gradlew || {
            echo "ERROR: android-project/gradlew is missing"
            exit 1
          }

          test -f android-project/settings.gradle || \
          test -f android-project/settings.gradle.kts || {
            echo "ERROR: Android settings.gradle file is missing"
            exit 1
          }

          test -f android-project/app/build.gradle || \
          test -f android-project/app/build.gradle.kts || {
            echo "ERROR: Android app build.gradle file is missing"
            exit 1
          }

      - name: Set up Gradle permissions
        run: chmod +x android-project/gradlew

      - name: Build Debug APK
        working-directory: android-project
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK_PATH="android-project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK file was not generated"
            find android-project -type f -name "*.apk"
            exit 1
          fi

          ls -lh "$APK_PATH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sumit-tag-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
