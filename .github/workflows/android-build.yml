name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Web Application Bundle
        run: npm run build

      - name: Copy Built Web Assets to Android Project Assets
        run: |
          mkdir -p android-project/app/src/main/assets/www
          cp -r dist/* android-project/app/src/main/assets/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android-project/gradlew

      - name: Build Debug APK with Gradle
        working-directory: ./android-project
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK Exists
        run: |
          echo "Checking APK output..."
          ls -la android-project/app/build/outputs/apk/debug/app-debug.apk
          echo "APK file generated successfully!"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sumit-tag-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
