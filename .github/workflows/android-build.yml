name: Build Sumit Tag Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sumit-tag-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm ci --legacy-peer-deps --prefer-offline

      - name: Build Web Application Bundle
        run: npm run build

      - name: Stage Web Assets into Android Project
        run: |
          mkdir -p android-project/app/src/main/assets/www
          cp -r dist/* android-project/app/src/main/assets/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify Android project structure
        run: |
          test -f android-project/gradlew || {
            echo "::error::android-project/gradlew is missing"
            exit 1
          }
          test -f android-project/settings.gradle.kts || {
            echo "::error::android-project/settings.gradle.kts is missing"
            exit 1
          }
          test -f android-project/app/build.gradle.kts || {
            echo "::error::android-project/app/build.gradle.kts is missing"
            exit 1
          }
          test -f android-project/app/src/main/assets/www/index.html || {
            echo "::error::Web assets not found in android-project/app/src/main/assets/www/index.html"
            exit 1
          }

      - name: Set up Gradle wrapper execution permission
        run: chmod +x android-project/gradlew

      - name: Build Debug APK with Gradle
        working-directory: android-project
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify and inspect generated APK
        run: |
          APK_PATH="android-project/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected APK file was not generated at $APK_PATH"
            echo "Searching for any generated .apk files:"
            find android-project -type f -name "*.apk"
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Generated APK file is empty (0 bytes)!"
            exit 1
          fi

          echo "================================================"
          echo "SUCCESS: Debug APK generated and verified!"
          ls -lh "$APK_PATH"
          echo "================================================"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sumit-tag-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
